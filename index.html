<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>m-o-n 견적 요청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Gowun+Batang:wght@400;700&family=Cormorant:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: 브랜드 카드(노랑) → 기본 패키지 → 아이콘 진행바 → 단계 화면 → 견적서 문서 · 하단 고정 합계 바
   color: PDF 가이드의 크림 바탕 / 명함 노랑 / 명함 민트 / 잉크 */
:root{
  --bg:#FAF6EE; --paper:#FFFFFF; --ink:#232220; --mute:#6F6A61; --line:#2F2D2A; --hair:#E4DDCF; --off:#C9C2B3;
  --yellow:#F2E486; --yellow-soft:#FBF4C8; --mint:#9BD4B8; --mint-soft:#E1F2E9; --mint-ink:#2C6E55; --neg:#B2563A; --neg-soft:#F8E6DE;
  --display:"Oswald","Arial Narrow",sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --logo:"Cormorant","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 150px}
.ic{display:block;flex:none}
.p{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.neg{color:var(--neg)}
button{font-family:inherit}
input,textarea,select{width:100%;border:0;border-bottom:1.5px solid var(--hair);background:transparent;font:inherit;font-size:16px;padding:8px 0;color:var(--ink);border-radius:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
button:focus-visible,.d:focus-visible{outline:2px solid var(--mint-ink);outline-offset:2px}
textarea{border:1.5px solid var(--hair);padding:10px;min-height:96px;resize:vertical;border-radius:4px}
select{cursor:pointer}
label{display:block;font-size:12.5px;color:var(--mute);font-weight:500}

/* 브랜드 카드 (PDF 명함) */
.brand{background:var(--yellow);padding:14px 20px 12px;text-align:center;position:relative}
.brand .tag{font-family:var(--display);font-weight:300;font-size:11px;letter-spacing:.14em}
.brand .logo{font-family:var(--logo);font-weight:500;font-size:44px;line-height:1;margin:4px 0 4px;letter-spacing:-.01em}
.brand .kinds{display:flex;justify-content:center;gap:20px;font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.brand .tagimg{height:13px;display:block;margin:0 auto}
.brand .logoimg{height:46px;display:block;margin:8px auto 8px}
.compact .brand{padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.compact .brand .tagimg{margin:0;height:10px}
.compact .brand .logoimg{height:24px;margin:0}
.compact .brand .kinds,.compact .brand-sub,.compact #pkg{display:none}
.compact .steps{margin-top:22px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.admlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);text-decoration:none;padding:4px 2px}
.admlink:hover{color:var(--ink)}
.brand-sub{background:var(--mint);padding:14px 18px;display:flex;align-items:center;gap:12px}
.brand-sub b{font-family:var(--serif);font-size:17px;font-weight:700;display:block;line-height:1.35}
.brand-sub span{font-size:13px}
.brand-sub .bi{width:38px;height:38px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}

/* 기본 패키지 */
.pkg{background:var(--paper);border:1.5px solid var(--ink);border-top:0;padding:16px 18px}
.pkg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pkg-top .nm{font-family:var(--serif);font-weight:700;font-size:16px}
.pkg-top .pr{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pkg-top .pr small{font-family:var(--sans);font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.incl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:0;list-style:none}
.incl li{display:flex;align-items:center;gap:5px;background:var(--mint-soft);color:var(--mint-ink);font-size:13px;padding:3px 10px 3px 7px;border-radius:999px}

/* 진행바 */
.steps{position:relative;display:flex;justify-content:space-between;margin:30px 2px 6px}
.steps .rail,.steps .fill{position:absolute;left:20px;top:19px;height:2px;background:var(--hair)}
.steps .rail{right:20px}
.steps .fill{background:var(--mint-ink);transition:width .25s}
.steps button{position:relative;z-index:1;display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;font-size:12px;color:var(--mute);cursor:default;width:56px}
.steps .no{position:absolute;top:-4px;right:4px;width:17px;height:17px;border-radius:50%;background:var(--paper);border:1.5px solid var(--hair);font-family:var(--display);font-size:10px;line-height:14px;text-align:center;color:var(--mute)}
.steps .on .no{border-color:var(--ink);color:var(--ink)}
.steps .done .no{display:none}
.stepcap{text-align:center;font-size:12.5px;color:var(--mute);margin:12px 0 0;padding-bottom:22px;border-bottom:1px solid var(--hair)}
.stepcap b{color:var(--ink);font-family:var(--display);letter-spacing:.1em;font-weight:500}
.steps .dot{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--hair);background:var(--paper);display:grid;place-items:center;color:var(--off)}
.steps button.done{color:var(--mute);cursor:pointer}
.steps button.done .dot{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.steps button.on{color:var(--ink);font-weight:700}
.steps button.on .dot{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--yellow-soft)}

/* 단계 화면 */
.sec{margin-top:44px}
.sh{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.sh .si{width:38px;height:38px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;margin-top:4px}
.sh .en{font-family:var(--display);font-size:11px;letter-spacing:.2em;color:var(--mute);display:block;line-height:1.2}
.sh h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;line-height:1.3}
.sh .sub{font-size:13.5px;color:var(--mute);margin:2px 0 0}
.box{background:var(--paper);border:1.5px solid var(--ink);padding:18px}
.opt{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding-block:18px;border-top:1px solid var(--hair)}
.opt:first-child{border-top:0;padding-top:2px}
.opt:last-child{padding-bottom:2px}
.oi{width:40px;height:40px;border-radius:6px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.opt.on .oi{background:var(--mint)}
.opt .t{min-width:0;font-weight:500;line-height:1.45}
.opt .t .p{font-weight:400;display:block;margin-top:2px}
.step{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);flex:none}
.step button{width:38px;height:38px;border:0;background:transparent;cursor:pointer;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.step button:disabled{color:var(--off);cursor:default}
.step span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px}
.tog{width:54px;height:32px;border:1.5px solid var(--ink);background:var(--paper);position:relative;cursor:pointer;padding:0;flex:none;border-radius:999px}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;background:var(--off);border-radius:50%;transition:left .15s}
.tog[aria-pressed="true"]{background:var(--mint)}
.tog[aria-pressed="true"]::after{left:25px;background:var(--ink)}
.hint{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mint-ink);background:var(--mint-soft);padding:6px 10px;border-radius:6px;margin-top:12px}
.hint.warn{color:var(--neg);background:var(--neg-soft)}
.fi{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:end;padding-block:14px}
.fi .ic{color:var(--mute);margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* 달력 */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-family:var(--display);font-weight:400;letter-spacing:.14em;font-size:16px}
.cal-head button{border:1.5px solid var(--ink);background:transparent;width:34px;height:34px;cursor:pointer;color:var(--ink);border-radius:50%;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .dw{font-size:11.5px;color:var(--mute);padding-bottom:2px}
.grid .dw:first-child{color:var(--neg)}
.d{aspect-ratio:1;max-width:100%;border:1.5px solid transparent;background:transparent;font-size:15px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;border-radius:50%;display:grid;place-content:center;line-height:1.1}
.d:hover:not(:disabled){border-color:var(--hair)}
.d:disabled{color:var(--off);cursor:default}
.d.blk{color:var(--off);text-decoration:line-through}
.d.sel{background:var(--yellow);border-color:var(--ink);font-weight:700;text-decoration:none;color:var(--ink)}
.d.book{background:var(--mint);color:var(--ink);text-decoration:none}
.d .n{display:block;font-size:9.5px;font-family:var(--display);letter-spacing:.04em;font-weight:400}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:4px}
/* 차수 카드 */
.sess{display:grid;gap:14px;margin-top:16px}
.scard{background:var(--paper);border:1.5px solid var(--ink);padding:16px 16px;display:grid;gap:16px}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cha{display:flex;align-items:center;gap:8px;font-weight:700}
.cha em{font-style:normal;font-family:var(--display);font-weight:500;letter-spacing:.06em;background:var(--yellow);border:1.5px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px}
.lk{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.srow .lb{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.srow .lb .ic{color:var(--mute)}
.mini{border:1.5px solid var(--hair);border-radius:999px;padding:4px 12px;width:auto;font-size:14px}
.placeln{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--bg);padding:8px 10px;border-radius:6px;min-width:0}
.placeln span{min-width:0;flex:1}
.empty-s{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--mute);font-size:14px;padding:18px;border:1.5px dashed var(--off);margin-top:12px}
/* 영상 */
.vid{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--hair)}
.vid .vh{display:flex;align-items:center;gap:8px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--hair);background:var(--paper);padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);border-radius:999px}
.vmode button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:14px}
.seg button small{color:var(--mute);margin-left:3px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:var(--yellow)}

/* 견적서 문서 */
.doc{background:var(--paper);border:1.5px solid var(--ink);font-size:14.5px}
.doc-hd{background:var(--yellow);padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1.5px solid var(--ink)}
.doc-hd .t1{font-family:var(--display);font-size:11px;letter-spacing:.16em;font-weight:300}
.doc-hd .t2{white-space:nowrap;font-family:var(--display);font-size:24px;letter-spacing:.2em;line-height:1.1;margin-top:2px}
.doc-hd .t2 small{font-family:var(--serif);font-size:14px;letter-spacing:0;margin-left:6px;font-weight:700}
.doc-hd .lg{font-family:var(--logo);font-weight:500;font-size:40px;line-height:.9}
.doc-meta{display:grid;grid-template-columns:1.2fr 1fr 1fr;border-bottom:1.5px solid var(--ink)}
.doc-meta div{padding:9px 12px;border-left:1px solid var(--hair);min-width:0}
.doc-meta div:first-child{border-left:0}
.doc-meta span{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.14em;color:var(--mute)}
.doc-meta b{font-weight:500;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-sec{padding:18px 20px;border-bottom:1px dashed var(--off)}
.doc-sec h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;font-weight:700}
.doc-sec h4>.ic{background:var(--ink);color:#fff;border-radius:5px;padding:5px;width:26px;height:26px}
.doc-sec h4 .lk{margin-left:auto;font-weight:400;display:flex;align-items:center;gap:3px;font-size:12.5px}
.sched{display:grid;gap:8px;font-size:14px}
.sched div{display:flex;gap:8px}
.sched em{font-style:normal;font-family:var(--display);background:var(--yellow);padding:0 7px;border-radius:999px;font-size:12.5px;height:fit-content;margin-top:2px}
.li{display:flex;align-items:baseline;gap:8px;padding-block:6px}
.li .lb{min-width:0}
.li .lb small{color:var(--mute);margin-left:4px;font-size:12.5px}
.li .dl{flex:1;border-bottom:1.5px dotted var(--off);min-width:12px;transform:translateY(-4px)}
.li .am{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.li.neg .lb,.li.neg .am{color:var(--neg)}
.li.neg .am{font-size:13px;background:var(--neg-soft);padding:0 7px;border-radius:4px}
.li.adj .am{color:var(--mint-ink)}
.doc-sum{padding:12px 20px;display:grid;gap:2px;font-size:13.5px;color:var(--mute)}
.doc-tot{background:var(--mint);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.doc-tot .k{font-family:var(--display);letter-spacing:.2em;font-size:14px}
.doc-tot .k small{display:block;font-family:var(--sans);letter-spacing:0;font-size:12px}
.doc-tot .v{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right}
.doc-tot .v small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--neg);font-weight:500;letter-spacing:0}
.doc-notes{padding:16px 20px;font-size:12.5px;color:var(--mute);display:grid;gap:6px;margin:0;list-style:none}
.doc-notes li{display:flex;gap:6px}
.doc-ft{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 20px;background:var(--bg);border-top:1px solid var(--hair);font-size:12.5px;flex-wrap:wrap}
.doc-ft .who{display:grid;gap:2px}
.pill{border:1px solid var(--line);border-radius:50%;background:#fff;padding:0 14px;font-size:12px;text-align:center}
.status{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);border-radius:999px;padding:0 10px;font-size:12px;white-space:nowrap;font-weight:500}
.s-requested{background:var(--yellow)} .s-quoted{background:#fff} .s-booked{background:var(--mint)} .s-done{background:var(--hair)} .s-canceled{background:transparent;color:var(--mute);text-decoration:line-through}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--yellow)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar small{display:block;font-size:12px;opacity:.75}
.bar .tot{font-family:var(--display);font-size:23px;font-weight:500;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.bar .tot em{font-style:normal;color:var(--yellow);font-size:15px}
.bar .nav{display:flex;gap:8px;align-items:center}
.bar .back{width:44px;height:44px;background:transparent;color:var(--bg);border:1.5px solid var(--bg);border-radius:50%;cursor:pointer;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);color:var(--ink);border:1.5px solid var(--ink);padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;border-radius:999px}
.btn:disabled{opacity:.45;cursor:default}
.bar .btn{border-color:var(--yellow)}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--paper);padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--ink);border-radius:999px}
.ghost:disabled{color:var(--off);border-color:var(--off);cursor:default}
.err{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--neg);background:var(--neg-soft);font-size:13.5px;margin-top:16px;padding:10px 12px;border-radius:6px}
.err[hidden]{display:none}
.foot{text-align:center;margin-top:36px;font-size:12.5px}
.foot a{color:var(--mute)}
.done-hd{text-align:center;margin:26px 0 18px}
.done-hd .ok{width:64px;height:64px;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink);display:grid;place-items:center;margin:0 auto 10px}
.done-hd h1{font-family:var(--serif);font-size:22px;margin:0}
.done-hd p{margin:4px 0 0;color:var(--mute);font-size:14px}
.next{display:grid;gap:10px;margin-top:20px}
.next div{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--paper);border:1px solid var(--hair);padding:10px 12px;border-radius:8px}
.next em{font-style:normal;font-family:var(--display);width:24px;height:24px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:12px;flex:none}
.sendbox{background:var(--paper);border:1.5px solid var(--ink);padding:16px 18px;margin-top:16px}
.msgpv{white-space:pre-wrap;word-break:break-all;font-family:var(--sans);font-size:13px;background:var(--bg);padding:10px 12px;border-radius:6px;margin:0;max-height:220px;overflow:auto}
a.btn,a.ghost{text-decoration:none}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191919}
.pinbox{max-width:320px;margin:60px auto 0;background:var(--paper);border:1.5px solid var(--ink);padding:26px 22px;text-align:center}
.pinbox h2{font-family:var(--serif);font-size:19px;margin:0 0 4px}
.pinbox input{text-align:center;font-size:20px;letter-spacing:.3em;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;font-size:13.5px;max-width:90vw;text-align:center;border-radius:999px;border:1.5px solid var(--yellow)}

/* ---------- admin ---------- */
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:14px 16px;margin-bottom:16px}
.adm-top h1{font-family:var(--logo);font-weight:500;font-size:28px;margin:0;line-height:1}
.adm-top h1 small{font-family:var(--display);font-size:11px;letter-spacing:.2em;color:var(--yellow);margin-left:8px}
.adm-top .ghost{background:transparent;color:var(--bg);border-color:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);margin-bottom:18px;background:var(--paper)}
.tabs button{border:0;border-left:1.5px solid var(--ink);background:transparent;padding:10px 2px;font-size:13.5px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected="true"]{background:var(--yellow)}
.tabs .cnt{background:var(--neg);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1.5px solid var(--ink);background:var(--paper);padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink);border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.row{border:1.5px solid var(--ink);background:var(--paper);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;color:var(--ink);width:100%;font-size:14.5px}
.row:hover{background:var(--yellow-soft)}
.row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--mute);min-width:0;display:flex;align-items:center;gap:4px}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:16px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px;margin:12px 0 0}
.kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ln{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:9px;border-top:1px solid var(--hair);font-size:14px;font-variant-numeric:tabular-nums}
.ln:first-child{border-top:0}
.ln span:first-child{min-width:0}
.ln input{width:120px;text-align:right;border:1.5px solid var(--neg);padding:5px 8px;font-size:14.5px;border-radius:4px;background:var(--neg-soft)}
.ln .x{border:0;background:transparent;color:var(--mute);cursor:pointer;padding:0 4px}
.adj{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:12px;align-items:end}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ah{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:16px;margin:24px 0 4px}
.ah .ex{font-family:var(--sans)}
.asub{font-size:13px;color:var(--mute);margin:0 0 10px}
.ptab{width:100%;border-collapse:collapse;font-size:14px}
.ptab td,.ptab th{padding:6px 4px;border-top:1px solid var(--hair);text-align:left;vertical-align:bottom}
.ptab th{font-weight:400;color:var(--mute);font-size:12px;border-top:0}
.ptab input{padding:4px 0;font-size:14.5px}
.ptab .num{text-align:right;width:100px}
.ptab .x{border:0;background:transparent;color:var(--mute);cursor:pointer}
.ptab tr.off td{opacity:.45}
.scroll{overflow-x:auto}
.kvp{display:grid;grid-template-columns:1fr 130px;gap:6px 12px;align-items:end;font-size:14px}
.kvp input{text-align:right}
.kvp .full{grid-column:1/-1}
.kvp .full input{text-align:left}
.kvp .full textarea{min-height:84px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap}
.chk input{width:auto}
.gacct{display:flex;align-items:center;gap:12px}
.glogo{width:40px;height:40px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.igset{border:0;padding:0;margin:0;min-width:0}
.igset:disabled{opacity:.45}
.evp{display:flex;gap:10px;background:var(--bg);padding:10px 12px;border-radius:6px;font-size:14px}
.evp-bar{width:4px;border-radius:2px;background:var(--mint-ink);flex:none}
.evp .p{display:flex;align-items:center;gap:4px}
.sub-kvp{margin:-4px 0 6px 52px;padding:10px 12px;background:var(--bg);border-radius:6px}
.tgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tgrow>.p{display:inline-flex;align-items:center;gap:4px;flex:1;min-width:0}
.d.gbusy{border:1.5px dashed var(--mint-ink);color:var(--mint-ink)}
.ex{font-size:11px;background:var(--yellow);padding:0 6px;color:var(--ink);border-radius:3px;font-weight:500}
.ahint{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-size:13.5px}
@media (max-width:400px){.doc-meta{grid-template-columns:1fr 1fr}.doc-meta div:first-child{grid-column:1/-1;border-bottom:1px solid var(--hair)}.doc-meta div:nth-child(2){border-left:0}.brand .logo{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<!-- ===== 금액 계산 (순수 함수 · 실제 앱에서는 서버 RPC가 같은 로직으로 재계산) ===== -->
<script id="pricing">
function buildLines(cfg, sel){
  const R=cfg.rates, L=[], add=(grp,label,qty,unit,unit_price,detail="")=>L.push({grp,label,detail,qty,unit,unit_price,amount:unit_price==null?null:unit_price*qty});
  const S=sel.sessions;
  add("촬영",cfg.base.label,1,"",cfg.base.price,`${cfg.base.hours}시간 · ${sel.noVideo?"":"영상 1편 · "}사진 ${cfg.base.photos}장`);
  if(S.length>1) add("촬영","촬영일 추가",S.length-1,"일",R.extra_day,`${S.length-1}일`);
  const over=S.map((s,i)=>({i,h:Math.max(0,s.hours-cfg.base.hours)})).filter(x=>x.h>0);
  const oh=over.reduce((a,x)=>a+x.h,0);
  if(oh) add("촬영","촬영 시간 연장",oh,"시간",R.extra_hour,over.map(x=>`${x.i+1}차 +${x.h}시간`).join(", "));
  // 출장비: 같은 지역은 한 번만 · 숙박: 숙박 지역의 차수마다 1박
  const seen=new Set();
  S.forEach((s,i)=>{
    if(s.region==="미정"){ if(!seen.has("미정")){seen.add("미정");add("이동","출장비",1,"",null,"장소 미정")} return }
    const r=cfg.regions.find(x=>x.name===s.region); if(!r) return;
    if(r.fee!==0&&!seen.has(r.name)){seen.add(r.name);add("이동","출장비",1,"",r.fee??null,r.name)}
    if(r.lodging) add("이동","숙박",1,"박",R.lodging_night??null,`${i+1}차 · ${r.name}`);
  });
  const V=sel.noVideo?[]:sel.videos;
  if(sel.noVideo) add("영상","영상 없이 사진만 촬영",1,"",R.no_video_adj??null);
  if(V.length>1) add("영상","영상 추가 제작",V.length-1,"편",R.extra_video,`${V.length-1}편`);
  V.forEach((v,i)=>{const t=cfg.video_len[v.len]; if(t&&t.add!==0) add("영상","영상 길이 추가",1,"",t.add,`영상 ${i+1} · ${t.label}`)});
  if(sel.photoAdd>0) add("사진","보정 사진 추가",sel.photoAdd/R.photo_step,"단위",R.photo_step_price,`+${sel.photoAdd}장`);
  cfg.extras.filter(e=>e.active&&sel.extras[e.code]).forEach(e=>add("옵션",e.label,1,"",e.price));
  return L;
}
function sumLines(lines,adj){const all=[...lines,...(adj||[])];return {sum:all.reduce((s,l)=>s+(l.amount||0),0),neg:lines.filter(l=>l.amount==null).length}}
</script>

  const acc=(cfg.integrations.cal_account||"").trim();if(acc)u.set("authuser",acc);

async function pinHash(s){const salt="m-o-n:";try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of salt+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "d"+h.toString(16)}}

$("tab-price").addEventListener("change",e=>{const el=e.target,p=el.dataset.p;if(!p)return;
  const t=el.dataset.t,raw=el.value.replace(/[^\d]/g,"");
  const sr=el.value.replace(/[^\d-]/g,"");
  const v=t==="bool"?el.checked:t==="num"?Number(raw)||0:t==="numnull"?(raw===""?null:Number(raw)):t==="numsigned"?(raw===""?null:(sr.startsWith("-")?-1:1)*Number(raw)):el.value;
  setP(draft,p,v);if(t==="num"||t==="numnull"||t==="numsigned")el.value=n2(v);if(p.endsWith("active"))renderPrice()});
$("tab-price").addEventListener("click",e=>{const t=e.target;let b;
  if(b=t.closest("[data-add]")){const k=b.dataset.add;draft[k].push(k==="extras"?{code:"opt_"+Date.now().toString(36),label:"새 옵션",price:0,active:false,note:""}:{label:"새 길이",add:0});return renderPrice()}
  if(b=t.closest("[data-del]")){const[k,i]=b.dataset.del.split(".");draft[k].splice(+i,1);return renderPrice()}
  if(t.closest("[data-reset]")){draft=null;renderPrice();return toast("저장된 값으로 되돌렸어요")}
  if(t.closest("[data-save]")){
    if(!draft.base.price||!draft.base.hours)return toast("기본 촬영비와 기본 시간을 넣어주세요");

    cfg={...draft,blocked:cfg.blocked};draft=null;persist();renderPrice();toast("저장했어요 · 고객 화면에 반영됨");

});

    <div style="min-width:0;flex:1"><b>Google 계정</b><div class="p">${G.connected?esc(G.account)+" · 연결됨":"연결 안 됨"}</div></div>
    ${G.connected?`<button class="ghost" data-gconn="0">연결 해제</button>`:`<button class="btn" data-gconn="1">${I("link",15,2)}연결하기</button>`}
  </div>
  <p class="ahint" style="display:flex;gap:6px;align-items:flex-start">${I("alert",14)}<span>미리보기에서는 연결을 흉내만 내요. 실제 앱에서는 구글 로그인 창이 뜨고, 캘린더·메일 권한을 한 번 허락하면 돼요.</span></p>
  <fieldset class="igset" ${G.connected?"":"disabled"}>
  ${ah("send","예약을 캘린더로 보내기")}
  <div class="box"><div class="opt"><span class="oi">${I("cal",20)}</span><div class="t">예약 확정 시 일정 자동 추가<span class="p">차수마다 일정 1개 · 취소하면 같이 지워져요</span></div>${sw("cal_push",IG.cal_push)}</div>
    <div class="kvp" style="margin-top:6px">
      <span>보낼 캘린더</span><select data-igv="google.calendar" class="mini">${G_DEMO.calendars.map(c=>`<option ${c===G.calendar?"selected":""}>${c}</option>`).join("")}</select>
      <span>미리 알림</span><select data-igv="cal_reminder" data-n="1" class="mini">${[[0,"없음"],[30,"30분 전"],[60,"1시간 전"],[1440,"하루 전"]].map(([v,t])=>`<option value="${v}" ${+IG.cal_reminder===v?"selected":""}>${t}</option>`).join("")}</select>
      <span class="full">일정 제목 <span class="p">{고객} {차수} {총일수} 를 쓰면 바뀌어 들어가요</span><input data-igv="cal_title" value="${esc(IG.cal_title)}"></span>
    </div>
    ${sample?`<p class="asub" style="margin:14px 0 6px">캘린더에 이렇게 들어가요</p>${eventPreview(sample)}`:""}</div>
  ${ah("inbox","캘린더 일정으로 날짜 막기")}
  <div class="box"><div class="opt"><span class="oi">${I("x",20)}</span><div class="t">캘린더에 일정 있는 날 자동 마감<span class="p">15분마다 확인 · 고객 달력에 ‘예약 마감’으로 보여요</span></div>${sw("cal_pull",IG.cal_pull)}</div>
    <div class="kvp" style="margin-top:6px"><span>어떤 일정을 볼까요</span><select data-igv="pull_mode" class="mini"><option value="allday" ${IG.pull_mode==="allday"?"selected":""}>종일 일정만</option><option value="any" ${IG.pull_mode==="any"?"selected":""}>일정이 하나라도 있으면</option></select></div></div>
  </fieldset>
  ${ah("user","관리자 로그인")}
  <div class="box"><div class="kvp"><span class="full">구글로 로그인할 수 있는 계정 <span class="p">한 줄에 하나 · 이 계정만 관리자 화면에 들어올 수 있어요</span><textarea data-igv="admins" placeholder="예) 구글 계정 이메일">${esc(IG.admins)}</textarea></span></div></div>`;
}
$("tab-int").addEventListener("click",e=>{let b;const IG=cfg.integrations;
  if(b=e.target.closest("[data-gconn]")){const on=b.dataset.gconn==="1";IG.google.connected=on;IG.google.account=on?G_DEMO.account:"";if(on&&!IG.google.calendar)IG.google.calendar=G_DEMO.calendars[1];
    persist();renderInteg();return toast(on?"구글 계정을 연결했어요 (미리보기)":"연결을 해제했어요")}
  if(b=e.target.closest("[data-tg]")){const on=b.dataset.tg==="1";IG.tg={connected:on,name:on?"윤정 (텔레그램)":""};persist();renderInteg();return toast(on?"텔레그램을 연결했어요 (미리보기)":"연결을 해제했어요")}
  if(b=e.target.closest("[data-ig]")){const k=b.dataset.ig;IG[k]=!IG[k];persist();renderInteg();toast(IG[k]?"켰어요":"껐어요")}
});
$("tab-int").addEventListener("change",e=>{const el=e.target,p=el.dataset.igv;if(!p)return;
  const v=el.dataset.n?Number(el.value):el.value.trim();
  if(p.startsWith("@"))setP(cfg,p.slice(1),v);else setP(cfg.integrations,p,v);
  persist();if(!["admins","mail_to","web3_key","cal_account","@brand.kakao_url","@brand.sms_to"].includes(p))renderInteg();toast("저장했어요")});

$("tab-cal").addEventListener("click",e=>{let b;
  if(b=e.target.closest("[data-mv]"))return moveYm(ad,+b.dataset.mv)&&renderAdminCal();
  const d=e.target.closest(".d");if(!d||d.disabled)return;
  const k=d.dataset.k,i=cfg.blocked.indexOf(k);if(i>-1)cfg.blocked.splice(i,1);else cfg.blocked.push(k);
  persist();renderAdminCal();toast(md(k)+(i>-1?" 마감 해제":" 마감"));
});

$("admIc").innerHTML='<svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';$("bLogo").src=LOGO;$("pLogo").src=LOGO;$("bTag").src=TAG;$("aLogo").src=LOGO_W;
$("bsIcon").innerHTML=I("camera",20);$("okIcon").innerHTML=I("check",30,2.2);
renderClient();
if(location.hash==="#admin")askAdmin();
</script>
